name: AQA tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1-5"   # щодня о 06:00 UTC у будні: ловимо зміни на проді
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: pytest --browser ${{ matrix.browser }}

      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: reports/
          retention-days: 14

  lighthouse:   # TC-049: поки поріг лише попереджає, бо оцінки коливаються між запусками
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://gourmet-info.netlify.app/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
