[pytest]
base_url = https://gourmet-info.netlify.app
testpaths = tests
addopts = -ra --html=reports/report.html --self-contained-html --screenshot=only-on-failure --output=reports/artifacts
markers =
    smoke: швидкі перевірки, що сайт живий
    nav: навігація та якорі
    form: форма запиту «Отримати підбір пари»
    responsive: адаптивність і мобільне меню
    media: відео, карта, ліниве завантаження
    a11y: доступність
    bug: тест фіксує відомий дефект (xfail до виправлення)
